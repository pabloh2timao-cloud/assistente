<style>
/* Plano: painel de bordo pessoal, escuro por escolha (um só tema).
   Ciano "arco" = ação/assistente; dourado = dinheiro que vira patrimônio.
   Layout: coluna de celular centralizada, navegação inferior, folha de lançamento. */
:root{
  --bg:#0B0F17; --surface:#131A26; --surface-2:#1A2333; --line:#243044;
  --text:#E8EDF5; --muted:#8A97AD;
  --accent:#55CDE6; --gold:#E9B44C;
  --bad:#F06A5F; --warn:#F2A33A; --good:#4CC38A;
  --display:"Chakra Petch", "Segoe UI", sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.app{max-width:440px;margin:0 auto;min-height:100%;padding:16px 16px 110px;display:flex;flex-direction:column;gap:16px;
  background:radial-gradient(600px 300px at 80% -80px, rgba(85,205,230,.10), transparent 70%)}

/* topo */
.top{display:flex;justify-content:space-between;align-items:center;padding-top:6px}
.hello small{display:block;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.hello h1{font-family:var(--display);font-weight:600;font-size:22px;text-wrap:balance}
.demo{font-size:11px;color:var(--gold);border:1px solid rgba(233,180,76,.4);padding:4px 8px;border-radius:99px;white-space:nowrap}

/* cartão herói */
.hero{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;grid-template-columns:1fr 112px;gap:12px;align-items:center}
.hero .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.hero .big{font-size:34px;font-weight:700;line-height:1.1;margin:4px 0 6px}
.hero .sub{color:var(--muted);font-size:13px;line-height:1.45}
.ring{position:relative;width:112px;height:112px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .center b{font-family:var(--display);font-size:22px}
.ring .center span{font-size:10px;color:var(--muted);line-height:1.2}

.renda{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.renda span{color:var(--muted);font-size:13px;margin-right:2px;flex-basis:100%}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600;transition:.15s}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(85,205,230,.08)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tile div{font-size:17px;font-weight:600;margin-top:4px}

h2{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.section{display:flex;flex-direction:column;gap:10px}

/* insights */
.ins{display:grid;grid-template-columns:4px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ins .stripe{background:var(--c)}
.ins .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ins .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.ins p{line-height:1.5;font-size:14px}
.ins p b{color:var(--text)}
.ins .act{align-self:flex-start;font-size:13px;font-weight:600;color:var(--accent);padding:2px 0}
.bad{--c:var(--bad)} .warn{--c:var(--warn)} .good{--c:var(--good)} .info{--c:var(--accent)} .money{--c:var(--gold)}

/* gráfico */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* categorias */
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.cat-head{width:100%;display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:12px;text-align:left}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2)}
.ico svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat-name{font-weight:600}
.cat-val{text-align:right;font-size:13px;color:var(--muted)}
.cat-val b{display:block;color:var(--text);font-size:15px}
.bar{grid-column:1/-1;position:relative;height:6px;background:var(--surface-2);border-radius:99px;margin-top:2px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--c)}
.bar .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.55;border-radius:2px}
.cat-detail{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0}
.row .when{color:var(--muted);font-size:12px}
.row button{color:var(--muted);font-size:12px;padding:0 4px}
.badge{font-size:10px;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-left:6px;text-transform:uppercase;letter-spacing:.05em}

/* investir */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;color:var(--muted)}
.step b{display:block;color:var(--text);font-size:14px;margin-top:2px}
.step.now{border-color:var(--gold)}
.step.done{border-color:var(--good)}
.prog{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog div{height:100%;background:linear-gradient(90deg,var(--gold),#F5D58A);border-radius:99px}
.slider{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.slider label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.slider label b{color:var(--text)}
input[type=range]{width:100%;accent-color:var(--gold)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:440px;margin:0 12px 12px;background:rgba(19,26,38,.92);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;padding:6px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0}
.nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
.fab{width:56px;height:56px;margin:-26px auto 0;border-radius:18px;background:var(--accent);color:#06222A !important;display:grid !important;place-items:center;box-shadow:0 8px 24px rgba(85,205,230,.35)}
.fab svg{width:26px !important;height:26px !important;stroke-width:2.4 !important}

/* folha de lançamento */
.scrim{position:fixed;inset:0;background:rgba(3,6,12,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:440px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 16px 18px;transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;gap:12px;max-height:94%;overflow:auto}
.sheet.open{transform:none}
.grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.amount{text-align:center;font-size:44px;font-weight:700;padding:4px 0}
.amount small{font-size:20px;color:var(--muted);margin-right:6px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cats button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.cats button svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cats button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.cats button[aria-pressed="true"] svg{stroke:var(--accent)}
.subs,.days{display:flex;flex-wrap:wrap;gap:6px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{background:var(--surface-2);border-radius:12px;padding:12px 0;font-family:var(--display);font-size:20px}
.save{background:var(--accent);color:#06222A;font-weight:700;border-radius:14px;padding:14px;font-size:16px}
.save:disabled{opacity:.35;cursor:default}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--surface-2);border:1px solid var(--good);color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--muted);font-size:13px;line-height:1.5}

/* radar */
.note{border:1px dashed rgba(233,180,76,.45);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
.note b{color:var(--gold)}
.stock{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.stock-head{width:100%;display:grid;grid-template-columns:58px 1fr 70px 64px;gap:10px;align-items:center;padding:10px 12px;text-align:left}
.tk{font-family:var(--display);font-weight:700;font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 0;text-align:center}
.stock-head .nome{font-weight:600;font-size:14px;line-height:1.2}
.stock-head .nome small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.spark{width:70px;height:28px}
.var{text-align:right;font-family:var(--display);font-weight:600;font-size:15px}
.up{color:var(--good)} .down{color:var(--bad)}
.stock-detail{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:12px}
.thermo{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thermo div{background:var(--surface-2);border-radius:10px;padding:8px;font-size:11px;color:var(--muted);border-top:3px solid var(--c)}
.thermo b{display:block;color:var(--text);font-size:13px;margin-top:2px}
.news{display:flex;flex-direction:column;gap:6px}
.news div{font-size:13px;line-height:1.45;padding-left:10px;border-left:2px solid var(--line)}
.news small{color:var(--muted);display:block;font-size:11px}
.read{background:rgba(85,205,230,.07);border:1px solid rgba(85,205,230,.3);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}
.read b{color:var(--accent)}
.buy{display:flex;flex-direction:column;gap:8px}
.buy .lbl{font-size:12px;color:var(--muted)}
.btn{background:var(--gold);color:#2A1C02;font-weight:700;border-radius:12px;padding:12px;font-size:14px}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.pos{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.pos small{color:var(--muted);font-size:11.5px}
.lesson{background:var(--surface);border:1px solid var(--gold);border-radius:12px;padding:12px;font-size:13px;line-height:1.5}
.link{color:var(--accent);font-weight:600;font-size:13px}

/* hoje / segmentos / tarefas / treino */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}.seg::-webkit-scrollbar{display:none}
.seg button{padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack span{height:100%}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12.5px}
.leg div{display:flex;align-items:center;gap:6px;color:var(--muted)}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg b{margin-left:auto;color:var(--text);font-family:var(--display);font-weight:600}
.rank{display:grid;grid-template-columns:96px 1fr 70px;gap:8px;align-items:center;font-size:13px}
.rank .b{height:8px;border-radius:99px;background:var(--surface-2);position:relative}
.rank .b span{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.rank .v{text-align:right;font-family:var(--display)}
.rank .v small{display:block;color:var(--muted);font-family:var(--body);font-size:11px}
.fx{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0}
.fx .n{font-size:14px;font-weight:600}
.fx .s{font-size:12px;color:var(--muted)}
.fx .v{text-align:right;font-family:var(--display);font-weight:600}
.fx .v button{display:block;margin-left:auto;color:var(--muted);font-size:11px;font-family:var(--body);font-weight:500;padding-top:2px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .full{grid-column:1/-1}
.form input,.form select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);font:inherit;font-size:14px;width:100%;min-width:0}
.form label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:right;padding:6px 4px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.ev{display:flex;gap:10px;font-size:13px;line-height:1.45;align-items:baseline}
.ev > b{font-family:var(--display);color:var(--gold);min-width:14px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card-h{display:flex;justify-content:space-between;align-items:center}
.card-h b{font-family:var(--display);font-size:15px;letter-spacing:.03em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center}
.check svg{width:14px;height:14px;stroke:#06222A;stroke-width:3;fill:none;opacity:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] svg{opacity:1}
.task .t{font-size:14px;line-height:1.35}
.task.done .t{color:var(--muted);text-decoration:line-through}
.task .meta{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.area{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:2px 7px;border-radius:6px}
.task .later{font-size:12px;color:var(--muted)}
.late{color:var(--bad);font-size:11px;font-weight:700}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);font:inherit}
.quick button{background:var(--accent);color:#06222A;font-weight:700;border-radius:12px;padding:0 16px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.week i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;border:1.5px solid var(--line)}
.week .ok i{background:var(--good);border-color:var(--good);color:#062214}
.week .miss i{border-color:var(--bad);color:var(--bad)}
.week .today i{border-color:var(--accent);color:var(--accent);box-shadow:0 0 10px rgba(85,205,230,.4)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ex-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex-h b{font-size:15px}
.ex-h span{color:var(--muted);font-size:12.5px}
.sets{display:flex;gap:6px;flex-wrap:wrap}
.set{min-width:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:600}
.set[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#062214}
.load{display:flex;align-items:center;gap:8px;margin-left:auto}
.load button{width:30px;height:30px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:16px}
.load b{font-family:var(--display);min-width:54px;text-align:center}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode button{padding:10px;border-radius:12px;border:1px solid var(--line);font-weight:600}
.mode button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(85,205,230,.08)}
.field{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--text);font:inherit;font-size:16px;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="hello"><small id="hoje"></small><h1 id="saudacao">Olá, Pablo</h1></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="demo" id="demo">Dados de exemplo</span>
      <button id="abrirRegras" aria-label="Regras, orçamento e backup" style="width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center"><svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></div>
  </header>
  <main id="view" class="section" style="gap:18px"></main>
</div>

<nav class="nav" aria-label="Navegação">
  <div class="nav-in">
    <button data-tab="hoje"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoje</button>
    <button data-tab="dinheiro"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 6V4h12v2"/></svg>Dinheiro</button>
    <button class="fab" id="abrirLancar" aria-label="Adicionar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="treino"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Treino</button>
    <button data-tab="tarefas"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Tarefas</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-label="Novo lançamento"></section>
<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================
   1. CONFIGURAÇÃO (é o mesmo config.py do seu app)
   ===================================================== */
const CONFIG = {
  categorias: {
    "Moradia": ["Aluguel","Condomínio","Luz","Água","Internet"],
    "Alimentação": ["Mercado","Delivery (iFood)","Restaurante"],
    "Transporte": ["Uber","Combustível","Parcela do carro","IPVA/Seguro","Manutenção"],
    "Saúde": ["Academia","Farmácia","Plano/Consulta"],
    "Assinaturas": ["Streaming","Celular","Apps"],
    "Lazer": ["Saídas","Viagens","Hobbies"],
    "Compras": ["Roupas","Eletrônicos","Casa"],
    "Outros": ["Outros"],
    "Dívidas": ["Empréstimo","Juros do cartão"],
    "Investimento": ["Reserva","Renda fixa","Dólar","Ações"],
  },
  orcamento: {"Moradia":1500,"Alimentação":1000,"Transporte":1700,"Saúde":200,"Assinaturas":150,"Lazer":200,"Compras":150,"Outros":100,"Dívidas":0},
  fixos: ["Aluguel","Condomínio","Luz","Água","Internet","Parcela do carro","Academia","Streaming","Celular"],
  aporteMinimo: 1400, pctExcedente: 0.5, taxaAnual: 0.1375,
};
const INVEST = "Investimento";
const HOJE = new Date(); HOJE.setHours(0,0,0,0);   // data real do celular
const pad = n => String(n).padStart(2,"0");
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mesKey = (off=0) => { const d = new Date(HOJE.getFullYear(), HOJE.getMonth()+off, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); };
const dataKey = (off=0) => { const d = new Date(HOJE); d.setDate(d.getDate()+off); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const difMeses = (a,b) => { const [ya,ma]=a.split("-").map(Number), [yb,mb]=b.split("-").map(Number); return (yb-ya)*12+(mb-ma); };
const DIAS_NO_MES = new Date(HOJE.getFullYear(), HOJE.getMonth() + 1, 0).getDate();

const ICONES = {
  "Moradia":"M3 11l9-7 9 7v9H3z", "Alimentação":"M4 3v8a3 3 0 0 0 6 0V3M7 3v18M17 3c-2 2-3 5-3 8h4v10",
  "Transporte":"M5 16l1.5-6h11L19 16M4 16h16v3H4zM7 19v2M17 19v2", "Saúde":"M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z",
  "Assinaturas":"M4 6h16v12H4zM10 9l5 3-5 3z", "Lazer":"M12 3l2.6 5.5 6 .8-4.4 4.2 1 6L12 16.8 6.8 19.5l1-6L3.4 9.3l6-.8z",
  "Compras":"M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2", "Outros":"M5 12h.01M12 12h.01M19 12h.01", "Dívidas":"M4 7h16v10H4zM4 11h16M8 15h3", "Investimento":"M3 17l6-6 4 4 8-8M15 7h6v6",
};
const icone = c => `<svg viewBox="0 0 24 24"><path d="${ICONES[c]}"/></svg>`;

/* =====================================================
   2. DADOS DE EXEMPLO (no app de verdade vêm do banco)
   ===================================================== */
function exemplo() {
  const L = [
    [3,"Alimentação","Mercado",220],[2,"Alimentação","Delivery (iFood)",62],[4,"Alimentação","Delivery (iFood)",74],
    [6,"Alimentação","Delivery (iFood)",58],[8,"Alimentação","Delivery (iFood)",91],[9,"Alimentação","Delivery (iFood)",55],
    [10,"Alimentação","Restaurante",45],[6,"Transporte","Combustível",150],
    [3,"Transporte","Uber",38],[4,"Transporte","Uber",45],[5,"Transporte","Uber",52],[6,"Transporte","Uber",61],
    [7,"Transporte","Uber",47],[8,"Transporte","Uber",55],[9,"Transporte","Uber",72],[10,"Transporte","Uber",40],
    [9,"Saúde","Farmácia",35],[8,"Lazer","Saídas",90],[10,"Investimento","Reserva",200],
  ];
  const agora = [mesKey(0)];
  return {
    exemplo: true, guardadoInicial: 3500,
    resgates: [{id:1, mes:mesKey(1), dia:5, valor:1000, motivo:"Mês mais fraco depois das férias"}],
    lanc: L.map(([dia,cat,sub,valor],i)=>({id:i+1, mes:mesKey(0), dia, cat, sub, valor})),
    // contas fixas: pagos = meses já pagos; fim = mês da última parcela (sem fim = conta contínua)
    fixos: [
      {id:1,nome:"Aluguel",cat:"Moradia",valor:1200,dia:5,pagos:agora},
      {id:2,nome:"Luz",cat:"Moradia",valor:140,dia:7,pagos:agora},
      {id:3,nome:"Internet",cat:"Moradia",valor:100,dia:8,pagos:agora},
      {id:4,nome:"Parcela do carro",cat:"Transporte",valor:1300,dia:1,pagos:agora,fim:mesKey(4)},
      {id:5,nome:"Academia",cat:"Saúde",valor:110,dia:2,pagos:agora},
      {id:6,nome:"Streaming",cat:"Assinaturas",valor:55,dia:1,pagos:agora},
      {id:7,nome:"Celular",cat:"Assinaturas",valor:60,dia:1,pagos:agora},
      {id:8,nome:"Empréstimo",cat:"Dívidas",valor:650,dia:15,pagos:[],fim:mesKey(13)},
    ],
    // compras parceladas no cartão: inicio = mês da 1ª parcela
    parcelados: [
      {id:1,cat:"Compras",sub:"Eletrônicos",total:600,n:3,inicio:mesKey(-1),dia:20},
      {id:2,cat:"Compras",sub:"Roupas",total:480,n:4,inicio:mesKey(0),dia:9},
    ],
    // renda: a RV de um mês cai no mês seguinte, então dá para prever
    rv: [
      {mes:mesKey(-3),prev:7500,real:7200},{mes:mesKey(-2),prev:8200,real:8200},
      {mes:mesKey(-1),prev:6000,real:5900},{mes:mesKey(0),prev:8000,real:8000},
      {mes:mesKey(1),prev:9200,real:null},
    ],
  };
}
function vazio(){
  return { exemplo:false, guardadoInicial:0, resgates:[], lanc:[], fixos:[], parcelados:[], rv:[{mes:mesKey(0),prev:0,real:null}] };
}
let S = exemplo();
let UI = { aba: "hoje", sub: "resumo", filtro: "Todas", catAberta: null, corte: 300, sheet: null, janela: "mes", acao: null, compra: {motivo:null, valor:null} };

/* =====================================================
   3. REGRAS (o mesmo regras.py, em JavaScript)
   ===================================================== */
const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const soma = arr => arr.reduce((a,l)=>a+l.valor,0);
const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const nomeMes = off => MESES[((HOJE.getMonth()+off)%12+12)%12];
const rotuloMes = key => { const [y,m] = key.split("-").map(Number); return MESES[m-1] + (y!==HOJE.getFullYear() ? "/"+String(y).slice(2) : ""); };
const pagoNoMes = f => (f.pagos||[]).includes(mesKey(0));
const fixosDoMes = off => S.fixos.filter(f=>!f.fim || mesKey(off) <= f.fim);
const restantes = f => difMeses(mesKey(0), f.fim) + 1;
const fixosComoLanc = () => fixosDoMes(0).filter(pagoNoMes).map(f=>({id:"f"+f.id, dia:f.dia, cat:f.cat, sub:f.nome, valor:f.valor, fixo:true}));
function mediaRv(){ const ult = S.rv.filter(r=>r.real!=null && r.real>0).slice(-3); return ult.length ? ult.reduce((a,r)=>a+r.real,0)/ult.length : 0; }
function rendaMes(off=0){ const r = S.rv.find(x=>x.mes===mesKey(off)); return (r && (r.real ?? (r.prev || null))) ?? mediaRv(); }
function rvProximo(){
  let r = S.rv.find(x=>x.mes===mesKey(1));
  if (!r) { r = {mes:mesKey(1), prev:0, real:null}; S.rv.push(r); }
  if (!r.prev && r.real==null) r.prev = Math.round(mediaRv()/100)*100;   // sem previsão ainda: usa a média
  return r;
}
function parcelasDoMes(off=0){
  return S.parcelados.map(p=>({p, k:difMeses(p.inicio, mesKey(off))})).filter(({p,k})=>k>=0 && k<p.n)
    .map(({p,k})=>({id:"p"+p.id, dia:k===0?p.dia:1, cat:p.cat, sub:p.sub, valor:p.total/p.n, parcela:`${k+1}/${p.n}`}));
}
const diaADia = () => S.lanc.filter(l=>l.cat!==INVEST && l.mes===mesKey(0));
const custos = () => [...diaADia(), ...fixosComoLanc(), ...parcelasDoMes(0)];
const ehFixo = l => l.fixo || l.parcela || CONFIG.fixos.includes(l.sub);
const pendentes = () => soma(fixosDoMes(0).filter(f=>!pagoNoMes(f)));
const livreNoMes = () => rendaMes(0) + soma((S.resgates||[]).filter(r=>r.mes===mesKey(0))) - soma(custos()) - investido() - pendentes();
const investido = () => soma(S.lanc.filter(l=>l.cat===INVEST && l.mes===mesKey(0)));
const ritmo = () => HOJE.getDate() / DIAS_NO_MES;
const ORC = () => S.orcamento || CONFIG.orcamento;
const fixosCat = cat => soma(fixosDoMes(0).filter(f=>f.cat===cat)) + soma(parcelasDoMes(0).filter(p=>p.cat===cat));
const limiteCat = cat => Math.max(ORC()[cat]||0, fixosCat(cat));     // nunca abaixo das contas fixas
const orcTotal = () => Object.keys(ORC()).reduce((a,c)=>a+limiteCat(c),0);

function aporteDoMes(renda){
  const excedente = Math.max(renda - orcTotal(), 0);
  return Math.min(CONFIG.aporteMinimo + excedente*CONFIG.pctExcedente, renda);
}
// mês em que você tira do guardado não tem meta de guardar
const aporteMeta = () => soma((S.resgates||[]).filter(r=>r.mes===mesKey(0))) > 0 ? 0 : aporteDoMes(rendaMes(0));
function montante(aporteMensal, anos){
  const tm = Math.pow(1+CONFIG.taxaAnual, 1/12) - 1; let s = 0;
  for (let m=0; m<anos*12; m++) s = s*(1+tm) + aporteMensal;
  return s;
}
function resumoCategoria(cat){
  const itens = custos().filter(l=>l.cat===cat);
  const gasto = soma(itens);
  const fixo = soma(itens.filter(ehFixo)) + soma(fixosDoMes(0).filter(f=>!pagoNoMes(f) && f.cat===cat));
  const variaveis = itens.filter(l=>!ehFixo(l));
  const porSub = {};
  (variaveis.length?variaveis:itens).forEach(l=>porSub[l.sub]=(porSub[l.sub]||0)+l.valor);
  const [vilao, valorVilao] = Object.entries(porSub).sort((a,b)=>b[1]-a[1])[0] || ["",0];
  const limite = limiteCat(cat);
  const sobraVar = limite - fixo;
  const usadoVar = sobraVar>0 ? soma(variaveis)/sobraVar : 0;
  return {cat, itens, gasto, fixo, limite, vilao, valorVilao, usado: limite? gasto/limite : 0, usadoVar};
}
function gerarInsights(){
  const out = [];
  for (const cat of Object.keys(ORC())){
    const r = resumoCategoria(cat);
    if (!r.gasto) continue;
    if (r.usado >= 1){
      const excesso = r.gasto - r.limite;
      out.push({tipo:"bad", tag:"Estourou", cat,
        texto:`<b>${cat}</b> passou do orçamento: ${brl(r.gasto)} de ${brl(r.limite)}. Maior vilão: <b>${r.vilao}</b> (${brl(r.valorVilao)}). Esses ${brl(excesso)} a mais, investidos todo mês, virariam <b>${brl(montante(excesso,10))}</b> em 10 anos.`});
    } else if (r.usadoVar > ritmo()+0.15){
      out.push({tipo:"warn", tag:"Acelerado", cat,
        texto:`<b>${cat}</b>: o gasto do dia a dia já usou ${Math.round(r.usadoVar*100)}% do que sobrou no orçamento, mas o mês só passou ${Math.round(ritmo()*100)}%. Segure o <b>${r.vilao}</b> (${brl(r.valorVilao)} até agora).`});
    }
  }
  // projeção: fixos ficam como estão, o dia a dia segue no ritmo atual
  const fixosLanc = soma(custos().filter(l=>ehFixo(l)));
  const varLanc = soma(custos()) - fixosLanc;
  const projecao = fixosLanc + pendentes() + varLanc/ritmo();
  if (projecao > orcTotal()){
    out.push({tipo:"warn", tag:"Projeção", texto:`No ritmo atual, você fecha o mês com <b>${brl(projecao)}</b> de custos, ${brl(projecao-orcTotal())} acima do orçamento de ${brl(orcTotal())}.`});
  }
  const falta = aporteMeta() - investido();
  const resg = soma((S.resgates||[]).filter(r=>r.mes===mesKey(0)));
  if (rendaMes(0) <= 0) {}
  else if (resg > 0) out.push({tipo:"money", tag:"Mês de resgate", texto:`Este mês entram <b>${brl(resg)}</b> do guardado no seu caixa, e a meta de guardar fica em zero. Se sobrar no fim do mês, devolva o que der.`});
  else if (falta > 0){
    out.push({tipo:"money", tag:"Aporte do mês", acao:"investir", texto:`Pela sua regra, o aporte deste mês é <b>${brl(aporteMeta())}</b>. Já foram ${brl(investido())}; faltam <b>${brl(falta)}</b> para a reserva.`});
  } else {
    out.push({tipo:"good", tag:"Aporte feito", texto:`Aporte do mês cumprido: ${brl(investido())}. Você pagou a "dívida" com você mesmo. 💪`});
  }
  if (!out.some(i=>i.tipo==="bad"||i.tipo==="warn")){
    out.unshift({tipo:"good", tag:"Tudo certo", texto:"Todas as categorias estão dentro do ritmo do mês."});
  }
  return out;
}

function graficoRitmo(){
  const W=360,H=170,P={l:40,r:10,t:10,b:24};
  const max = Math.max(orcTotal(), soma(custos()))*1.05;
  const x = d => P.l + (d-1)/(DIAS_NO_MES-1)*(W-P.l-P.r);
  const y = v => H-P.b - v/max*(H-P.t-P.b);
  // acumulado real até hoje
  let acc=0; const pts=[];
  for(let d=1; d<=HOJE.getDate(); d++){ acc += soma(custos().filter(l=>l.dia===d)); pts.push([x(d),y(acc)]); }
  const area = `M${x(1)},${y(0)} `+pts.map(p=>`L${p[0]},${p[1]}`).join(" ")+` L${pts.at(-1)[0]},${y(0)} Z`;
  const linha = pts.map((p,i)=>(i?"L":"M")+p[0]+","+p[1]).join(" ");
  // planejado: fixos lançados + resto do orçamento em ritmo linear
  const fixos = soma(custos().filter(l=>ehFixo(l)));
  const plano = d => fixos + (orcTotal()-fixos)*d/DIAS_NO_MES;
  const grid = [0, 0.5, 1].map(f=>{const v=Math.round(max*f/1000)*1000;return `<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v/1000}k</text>`}).join("");
  const last = pts.at(-1);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto acumulado do mês comparado ao ritmo planejado">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <line x1="${x(1)}" y1="${y(plano(1))}" x2="${x(DIAS_NO_MES)}" y2="${y(plano(DIAS_NO_MES))}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.5"/>
    <line x1="${x(HOJE.getDate())}" x2="${x(HOJE.getDate())}" y1="${P.t}" y2="${H-P.b}" stroke="var(--line)" stroke-dasharray="2 3"/>
    <path d="${area}" fill="url(#ga)"/><path d="${linha}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>
    <text x="${x(1)}" y="${H-6}" font-size="10" fill="var(--muted)">1</text>
    <text x="${x(HOJE.getDate())}" y="${H-6}" font-size="10" fill="var(--text)" text-anchor="middle">hoje</text>
    <text x="${x(DIAS_NO_MES)}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${DIAS_NO_MES}</text>
  </svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>Gasto acumulado</span><span><i style="background:var(--muted)"></i>Ritmo planejado</span></div></div>`;
}

/* ---------- guardado: saldo, aportes e resgates ---------- */
const aportesAte = off => soma(S.lanc.filter(l=>l.cat===INVEST && l.mes<=mesKey(off)));
const resgatesAte = off => soma((S.resgates||[]).filter(r=>r.mes<=mesKey(off)));
const resgatesDoMes = off => soma((S.resgates||[]).filter(r=>r.mes===mesKey(off)));
const saldoGuardado = (off=0) => (S.guardadoInicial||0) + aportesAte(off) - resgatesAte(off);
const custoMensal = () => orcTotal();
const coberturaMeses = (off=0) => custoMensal()>0 ? saldoGuardado(off)/custoMensal() : 0;
const fmtMeses = m => m.toFixed(1).replace(".",",");

// o conselho: segurar as pontas, usar o guardado ou seguir o plano
function folego(){
  const saldo = saldoGuardado(0), cob = coberturaMeses(0), prox = projecaoMes(1);
  const falta = -prox.sobra;
  if (falta > 0 && prox.renda > 0){
    const diaAtual = prox.dia, diaMax = Math.max(prox.renda - prox.fix - prox.parc, 0);
    const sobraGuardado = saldo - falta;
    return {tipo:"bad", tag:`Segure as pontas · ${prox.mes}`,
      texto:`Em ${prox.mes} a renda prevista (${brl(prox.renda)}) não cobre contas, parcelas e o dia a dia no ritmo atual: faltam <b>${brl(falta)}</b>. `+
        `Dá para fechar de dois jeitos: <b>baixar o dia a dia para ${brl(diaMax/4.3)} por semana</b> (hoje está em ${brl(diaAtual/4.3)}) `+
        (sobraGuardado>0 ? `ou <b>usar ${brl(falta)} do guardado</b>, ficando com ${brl(sobraGuardado)} (${fmtMeses(sobraGuardado/custoMensal())} mês de custo).` : `porque o guardado (${brl(saldo)}) não cobre a diferença.`)};
  }
  if (cob < 1) return {tipo:"warn", tag:"Fôlego curto", texto:`Seu guardado cobre <b>${fmtMeses(cob)} mês</b> do seu custo. Evite resgatar agora; a prioridade é chegar a 3 meses.`};
  if (cob < 3) return {tipo:"warn", tag:"Fôlego em construção", texto:`Seu guardado cobre <b>${fmtMeses(cob)} meses</b> do seu custo. Resgate só se a renda não fechar o mês.`};
  return {tipo:"good", tag:"Fôlego bom", texto:`Seu guardado cobre <b>${fmtMeses(cob)} meses</b> do seu custo. Siga guardando pela regra.`};
}

      <div class="tile" style="border-color:var(--gold)"><small>Regra + corte</small><div class="num" style="color:var(--gold)" id="comCorte">${brl(montante(comCorte,10))}</div></div>
    </div>

  </div>
  <button class="btn ghost" data-tab-go="regras">Ver minhas regras e orçamento</button>`;

function mesesAte(saldo, aporte, meta){
  const tm = Math.pow(1+CONFIG.taxaAnual,1/12)-1; let m=0;
  while(saldo<meta && m<600){ saldo = saldo*(1+tm)+aporte; m++; }
  return m;
}

function telaRegras(){
  const cats = Object.keys(ORC());
  return `

const COR = { fixas:"#6C8EF5", parcelas:"#B49CFF", dia:"var(--accent)", inv:"var(--gold)", livre:"#2A3548" };
const pctDe = (v, base) => base>0 ? Math.round(v/base*100) : 0;

function cardRendaVazia(){

function paraOndeVai(){
  const r = rendaMes(0);
  const fix = soma(fixosDoMes(0)), parc = soma(parcelasDoMes(0)), dia = soma(diaADia()), inv = investido();
  const livre = Math.max(r - fix - parc - dia - inv, 0);
  const base = Math.max(r, fix + parc + dia + inv, 1);
  const partes = [["Contas fixas",fix,COR.fixas],["Parcelas do cartão",parc,COR.parcelas],["Dia a dia",dia,COR.dia],["Investido",inv,COR.inv],["Livre",livre,COR.livre]];
  const porCat = {};
  [...diaADia(), ...fixosDoMes(0).map(f=>({cat:f.cat, valor:f.valor})), ...parcelasDoMes(0)].forEach(l=>porCat[l.cat]=(porCat[l.cat]||0)+l.valor);
  const rank = Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,6);

/* ---------- renda (RV) e os próximos meses ---------- */
function rendaPrevista(off){
  if (off===0) return rendaMes(0);
  if (off===1) { const r = rvProximo(); return r.real ?? r.prev; }
  return mediaRv();
}
function projecaoMes(off){
  const fix = soma(fixosDoMes(off)), parc = soma(parcelasDoMes(off));
  const dia = soma(diaADia()) / ritmo();                    // dia a dia no ritmo deste mês
  const renda = rendaPrevista(off), usar = resgatesDoMes(off);
  return {off, mes:nomeMes(off), renda, usar, fix, parc, dia, total:fix+parc+dia, sobra:renda+usar-fix-parc-dia};
}
// o plano: com essa renda, quanto vai para contas, quanto guardar e quanto sobra para viver
function planoDoMes(renda, off){
  const obrig = soma(fixosDoMes(off)) + soma(parcelasDoMes(off)), usar = resgatesDoMes(off);
  // mês em que você tira do guardado não é mês de guardar
  const guardar = usar>0 ? 0 : Math.max(Math.min(aporteDoMes(renda), renda - obrig), 0);
  const viver = renda + usar - obrig - guardar;
  return {renda, usar, obrig, guardar, viver, semana: viver/4.3, dia: viver/30};
}
function cardPlano(renda, off){
  const p = planoDoMes(renda, off), base = Math.max(renda, p.obrig, 1);
  return `<div class="card">
    <div class="card-h"><b>Plano de ${rotuloMes(mesKey(off))}</b><span class="muted">renda ${brl(renda)}${p.usar>0?` + ${brl(p.usar)} guardado`:""}</span></div>
    <div class="stack"><span style="width:${p.obrig/base*100}%;background:${COR.fixas}"></span><span style="width:${p.guardar/base*100}%;background:${COR.inv}"></span><span style="width:${Math.max(p.viver,0)/base*100}%;background:${COR.dia}"></span></div>

    <div class="fx" style="grid-template-columns:12px 1fr auto"><i style="width:10px;height:10px;border-radius:3px;background:${COR.fixas}"></i><div><div class="n">Contas e parcelas</div><div class="s">já comprometido</div></div><div class="v">${brl(p.obrig)}</div></div>
    <div class="fx" style="grid-template-columns:12px 1fr auto"><i style="width:10px;height:10px;border-radius:3px;background:${COR.inv}"></i><div><div class="n">Guardar</div><div class="s">${p.usar>0?"mês de resgate: não guarda":`${brl(CONFIG.aporteMinimo)} + ${CONFIG.pctExcedente*100}% do que passar de ${brl(orcTotal())}`}</div></div><div class="v" style="color:var(--gold)">${brl(p.guardar)}</div></div>
    <div class="fx" style="grid-template-columns:12px 1fr auto"><i style="width:10px;height:10px;border-radius:3px;background:${COR.dia}"></i><div><div class="n">Pode gastar no dia a dia</div><div class="s">${p.viver>0?`≈ ${brl(p.semana)} por semana · ${brl(p.dia)} por dia`:"nada sobra para o dia a dia"}</div></div><div class="v" style="color:${p.viver<0?"var(--bad)":"var(--accent)"}">${brl(p.viver)}</div></div>
    ${p.viver<0?`<p class="muted" style="color:var(--bad)">As contas passam da renda. Antes de guardar, é preciso cortar ou renegociar algo.</p>`:p.usar>0 && renda - p.obrig >= projecaoMes(off).dia ? `<p class="muted" style="color:var(--warn)">Pelo ritmo atual de gastos, a renda sozinha já fecha este mês. Talvez nem precise tirar do guardado: se der, mantenha o dinheiro lá.</p>`
      : p.usar===0 && p.guardar<aporteDoMes(renda) ? `<p class="muted">A renda não cobre o aporte cheio da regra. O app guarda o que dá sem deixar o mês negativo.</p>`:""}
  </div>`;
}
const rvPendente = () => { const r = S.rv.find(x=>x.mes===mesKey(0)); return r && r.real==null && HOJE.getDate()>=2 ? r : null; };

function telaFuturo(){
  const rv = rvProximo(), meses = [1,2,3,4,5,6].map(projecaoMes);
  const hist = S.rv.filter(r=>r.real!=null && r.prev>0);

  S.parcelados.forEach(p=>{ const fim=difMeses(mesKey(0), p.inicio)+p.n-1; if(fim>=0) ev.push([fim+1, `Parcela de <b>${p.sub}</b> (${brl(p.total/p.n)}) termina em ${rotuloMes(mesKey(fim))}.`]); });

  </div>

  ${ev.length?`<div class="card"><div class="card-h"><b>O que muda</b></div>${ev.map(([,t])=>`<div class="ev"><b>›</b><span>${t}</span></div>`).join("")}</div>`:""}

  <div class="card"><div class="card-h"><b>Previsto x caiu</b>${hist.length?`<span class="muted">erro médio ${(erroMedio*100).toFixed(1).replace(".",",")}%</span>`:""}</div>
    <table class="tbl"><tr><th>Mês</th><th>Previsto</th><th>Caiu</th><th>Diferença</th></tr>
    ${S.rv.map(r=>`<tr><td>${rotuloMes(r.mes)}</td><td>${brl(r.prev)}</td><td>${r.real!=null?brl(r.real):"—"}</td><td style="color:${r.real==null?"var(--muted)":r.real>=r.prev?"var(--good)":"var(--bad)"}">${r.real!=null?(r.real-r.prev>=0?"+":"")+brl(r.real-r.prev):"a confirmar"}</td></tr>`).join("")}
    </table>
    <p class="muted">Quando você me mandar as regras da sua RV (indicadores, pesos e gatilhos), a previsão passa a ser calculada aqui dentro.</p>
  </div>`;
}
function graficoFuturo(meses){
  const W=360,H=190,P={l:36,r:8,t:14,b:26};
  const max = Math.max(1000, ...meses.map(m=>Math.max(m.renda,m.total)))*1.1;
  const bw = (W-P.l-P.r)/meses.length, y = v => H-P.b - v/max*(H-P.t-P.b), h = v => v/max*(H-P.t-P.b);
  const grid=[0,0.5,1].map(f=>{const v=Math.round(max*f/1000)*1000;return `<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-5}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v/1000}k</text>`}).join("");
  const bars = meses.map((m,i)=>{
    const x = P.l + i*bw + bw*0.2, w = bw*0.6; let base = 0;
    const seg = [[m.fix,COR.fixas],[m.parc,COR.parcelas],[m.dia,COR.dia]].map(([v,c])=>{const r=`<rect x="${x}" y="${y(base+v)}" width="${w}" height="${Math.max(h(v),0)}" fill="${c}"/>`; base+=v; return r;}).join("");
    return seg + `<line x1="${x-4}" x2="${x+w+4}" y1="${y(m.renda)}" y2="${y(m.renda)}" stroke="var(--gold)" stroke-width="2.5"/>
      <text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${m.mes}</text>`;
  }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Renda prevista e gastos dos próximos 6 meses">${grid}${bars}</svg>
    <div class="legend"><span><i style="background:${COR.fixas}"></i>Contas fixas</span><span><i style="background:${COR.parcelas}"></i>Parcelas</span><span><i style="background:${COR.dia}"></i>Dia a dia</span><span><i style="background:var(--gold)"></i>Renda prevista</span></div></div>`;
}

/* =====================================================
   4b. RADAR DE AÇÕES (empresas FICTÍCIAS, só para o layout)
   No app real: cotações da B3 e notícias vêm de uma API.
   ===================================================== */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function serie(seed, preco, varMes, varAntes, vol){
  // 90 pregões: 68 "antes" + 22 do último mês, terminando exatamente no preço atual
  const r = rng(seed), n = 90, corte = 68, out = [];
  const pMes = preco/(1+varMes), pIni = pMes/(1+varAntes);
  for(let i=0;i<n;i++){
    const base = i<=corte ? pIni*Math.pow(pMes/pIni, i/corte) : pMes*Math.pow(preco/pMes, (i-corte)/(n-1-corte));
    const ponte = i<=corte ? Math.sin(Math.PI*i/corte) : Math.sin(Math.PI*(i-corte)/(n-1-corte));
    out.push(base*(1 + (r()-0.5)*vol*ponte));
  }
  return out;
}

  return E.map((e,i)=>({...e, hist: serie(1000+i*77, e.preco, e.varMes, e.varAntes, e.vol)}));
}
let EMP = empresasExemplo();

const ultimo = e => e.hist.at(-1);
const variacao = (e, dias) => ultimo(e)/e.hist.at(-1-dias) - 1;
const pct = v => (v>=0?"+":"") + (v*100).toFixed(1).replace(".",",") + "%";

function sparkline(hist, w=70, h=28, cor, estilo){
  const min=Math.min(...hist), max=Math.max(...hist);
  const pts = hist.map((v,i)=>`${(i/(hist.length-1)*w).toFixed(1)},${(h-2-(v-min)/(max-min||1)*(h-4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" style="${estilo||`width:${w}px;height:${h}px`}"><polyline points="${pts}" fill="none" stroke="${cor}" stroke-width="1.6"/></svg>`;
}
function leitura(e){
  const vm = variacao(e,21), t = e.termo;
  const ruins = (t.lucro==="cai") + (t.divida==="alta");
  if (vm < -0.05 && ruins >= 1) return `Queda <b>com motivo aparente</b>: ${t.lucro==="cai"?"o lucro está caindo":""}${ruins===2?" e ":""}${t.divida==="alta"?"a dívida está alta":""}. Parecer "barata" aqui pode ser armadilha: a ação pode seguir caindo.`;
  if (vm < -0.05) return `Os números da empresa <b>seguem bons</b>; a queda veio de notícia ou incerteza. Pode ser exagero do mercado, ou o mercado pode estar vendo um risco que ainda não apareceu nos números. <b>Não é previsão.</b>`;
  if (vm > 0.08 && t.pl==="caro") return `Subiu forte e <b>ficou cara</b> pelo preço/lucro. Parte do otimismo já está no preço: se a notícia boa não se confirmar, a queda costuma ser rápida.`;
  if (vm > 0.03) return `Alta acompanhada de <b>lucro crescendo</b>. Movimento coerente com os números, o que ainda não garante que continue.`;
  return `Movimento pequeno no mês. Nada que mude o quadro da empresa.`;
}

function telaCarteira(){
  const valorPos = p => p.qtd * ultimo(EMP.find(e=>e.tk===p.tk));

  const res = total/10000 - 1;
  return `<div class="section">

    </div>
    ${CART.pos.length?`<div>${CART.pos.map(p=>{const v=valorPos(p), r=v/p.custo-1;return `<div class="pos"><span><b>${p.tk}</b> · ${p.motivo}<br><small>comprou ${brl(p.custo)} no mês ${p.mes}</small></span><span class="num ${r>=0?"up":"down"}" style="text-align:right">${brl(v)}<br><small>${pct(r)}</small></span></div>`}).join("")}</div>
      <button class="btn ghost" id="avancar">Avançar 1 mês no tempo</button>`
    :'<p class="muted">Nenhuma compra ainda. Abra uma ação no radar para comprar.</p>'}

  </div>`;
}
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function avancarMes(){
  // cada empresa anda 21 pregões: tendência pequena (qualidade) + muito acaso
  EMP.forEach(e=>{ for(let d=0; d<21; d++){ const p=ultimo(e); e.hist.push(p*(1 + e.q/21 + e.vol*0.35*gauss()/Math.sqrt(21)*1.6)); } e.hist = e.hist.slice(-90); });
  CART.mes++;
  const res = CART.pos.map(p=>({p, r: p.qtd*ultimo(EMP.find(e=>e.tk===p.tk))/p.custo-1}));
  const certos = res.filter(x=>x.r>0).length;
  const porMotivo = {}; res.forEach(x=>{(porMotivo[x.p.motivo] ??= []).push(x.r)});
  const resumo = Object.entries(porMotivo).map(([m,rs])=>`${m}: ${pct(rs.reduce((a,b)=>a+b,0)/rs.length)}`).join(" · ");
  CART.licao = `<b>Mês ${CART.mes}:</b> ${certos} de ${res.length} posições no positivo. Por motivo: ${resumo}.<br><span class="muted">Repare quanto o acaso pesa em poucos meses: até empresa boa cai e empresa ruim sobe. Só depois de muitos meses dá para saber se um motivo funciona de verdade.</span>`;
}

  if (aVencer) out.push({tipo: aVencer.dia<HOJE.getDate()?"bad":"warn", tag:"Conta a pagar", texto:`<b>${esc(aVencer.nome)}</b> ${aVencer.dia<HOJE.getDate()?"venceu":"vence"} dia ${aVencer.dia}: ${brl(aVencer.valor)}.`, ir:"fixos"});
  const prox = projecaoMes(1);
  if (prox.sobra>=0 && prox.renda>0) out.push({tipo:"info", tag:`${prox.mes} · renda prevista`, texto:`Sua RV deve render <b>${brl(prox.renda)}</b> em ${prox.mes}. Com contas, parcelas e o ritmo atual de gastos, sobram <b>${brl(prox.sobra)}</b>.`, ir:"futuro"});
  const falta = aporteMeta() - investido();
  if (falta>0) out.push({tipo:"money", tag:"Investir", texto:`Faltam <b>${brl(falta)}</b> para o aporte do mês.`, ir:"investir"});
  return out.slice(0,5);
}
function telaHoje(){
  const dd = doDia(), t = treinoDeHoje();
  const itens = dd.length + (t?1:0);
  const feitos = dd.filter(feita).length + (t && treinou(0)?1:0);
  const C = 2*Math.PI*46, p = itens? feitos/itens : 0;
  return `
  <section class="hero">
    <div><div class="lbl">Seu dia</div>
      <div class="big num">${feitos} <span style="font-size:20px;color:var(--muted)">de ${itens}</span></div>
      <div class="sub">${dd.length} tarefas${t?" + treino":""}. ${itens && p>=1?"Dia fechado. 👏":"Uma coisa de cada vez."}</div></div>
    <div class="ring"><svg viewBox="0 0 112 112"><circle cx="56" cy="56" r="46" stroke="var(--surface-2)" stroke-width="10" fill="none"/>
      <circle cx="56" cy="56" r="46" stroke="var(--accent)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>
      <div class="center"><b class="num">${Math.round(p*100)}%</b><span>concluído</span></div></div>
  </section>

  ${rvPendente() ? cardConfirmacao(rvPendente(), false) : ""}
  <div class="section"><h2><span class="dot"></span>Assistente</h2>
    ${insightsDoDia().map(i=>`<article class="ins ${i.tipo}"><div class="stripe"></div><div class="body"><span class="tag">${i.tag}</span><p>${i.texto}</p>
      <button class="act" ${SUBS[i.ir]?`data-tab-go="${i.ir}"`:`data-tab="${i.ir}"`}>Abrir →</button></div></article>`).join("")}
  </div>

  <div class="card"><div class="card-h"><b>Tarefas</b><button class="link" data-tab="tarefas">Ver todas →</button></div>
    ${dd.length?dd.sort((a,b)=>feita(a)-feita(b)).slice(0,5).map(x=>linhaTarefa(x,true)).join(""):'<p class="muted">Nada para hoje.</p>'}</div>

  <div class="card"><div class="card-h"><b>Treino</b><button class="link" data-tab="treino">Abrir →</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div><div style="font-weight:700;font-size:16px">${t?t.nome:"Descanso"}</div><div class="muted">${t?`${t.ex.length} exercícios · ${Object.keys(feitosHoje()).length}/${t.ex.reduce((a,e)=>a+e[1],0)} séries`:"Dia livre"}</div></div>
      ${t?`<span class="area" style="--c:${treinou(0)?"var(--good)":"var(--warn)"}">${treinou(0)?"Feito":"Pendente"}</span>`:""}</div></div>

  <div class="card"><div class="card-h"><b>Dinheiro</b><button class="link" data-tab="dinheiro">Abrir →</button></div>
    <div class="stats">
      <div><small class="muted">Livre no mês</small><div class="num" style="font-size:17px;font-weight:600">${brl(livreNoMes())}</div></div>
      <div><small class="muted">Gasto hoje</small><div class="num" style="font-size:17px;font-weight:600">${brl(soma(diaADia().filter(l=>l.dia===HOJE.getDate())))}</div></div>
      <div><small class="muted">Guardado</small><div class="num" style="font-size:17px;font-weight:600;color:var(--gold)">${brl(saldoGuardado(0))}</div></div>
    </div>
    <button class="btn ghost" id="abrirGasto">Lançar gasto</button></div>`;
}

/* =====================================================
   5. FOLHA "ADICIONAR": gasto ou tarefa
   ===================================================== */
function abrirSheet(modo){
  UI.sheet = {modo: modo || (UI.aba==="tarefas"?"tarefa":"gasto"), cat:"Alimentação", sub:"Delivery (iFood)", valor:"", dia:HOJE.getDate(), forma:"avista", n:3, titulo:"", area:"Trabalho", q:0, rotina:false};
  renderSheet();
  document.getElementById("sheet").classList.add("open");
  document.getElementById("scrim").classList.add("open");
}
function fecharSheet(){
  UI.sheet = null;
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
}
function renderSheet(){
  const s = UI.sheet; if(!s) return;
  const topo = `<div class="grip"></div><div class="mode" role="group" aria-label="O que adicionar"><button aria-pressed="${s.modo==="gasto"}" data-modo="gasto">Gasto</button><button aria-pressed="${s.modo==="tarefa"}" data-modo="tarefa">Tarefa</button></div>`;
  if (s.modo==="tarefa"){
    document.getElementById("sheet").innerHTML = topo + `
      <input class="field" id="sheetTitulo" placeholder="O que precisa ser feito?" value="${s.titulo.replace(/"/g,"&quot;")}" aria-label="Título da tarefa" autocomplete="off">
      <div class="subs">${Object.keys(AREAS).map(a=>`<button class="chip" aria-pressed="${s.area===a}" data-sarea="${a}">${a}</button>`).join("")}</div>
      <div class="subs">${[[0,"Hoje"],[1,"Amanhã"],[2,"Depois de amanhã"],[7,"Daqui 1 semana"]].map(([k,n])=>`<button class="chip" aria-pressed="${s.q===k}" data-sq="${k}">${n}</button>`).join("")}</div>
      <div class="subs"><button class="chip" aria-pressed="${s.rotina}" data-srotina="1">↻ Repetir todo dia</button></div>
      <button class="save" id="salvarTarefa">Salvar tarefa</button>`;
    const inp = document.getElementById("sheetTitulo");
    inp.oninput = e => s.titulo = e.target.value;
    return;
  }
  const v = parseFloat((s.valor||"0").replace(",","."));
  document.getElementById("sheet").innerHTML = topo + `
    <div class="amount num"><small>R$</small>${s.valor||"0"}${s.forma==="parcelado"&&v>0?`<div style="font-size:14px;color:var(--muted);font-family:var(--body);font-weight:600">${s.n}× de ${brl(v/s.n)}</div>`:""}</div>
    <div class="cats">${Object.keys(CONFIG.categorias).map(c=>`<button aria-pressed="${s.cat===c}" data-scat="${c}">${icone(c)}${c}</button>`).join("")}</div>
    <div class="subs">${CONFIG.categorias[s.cat].map(x=>`<button class="chip" aria-pressed="${s.sub===x}" data-ssub="${x}">${x}</button>`).join("")}</div>
    <div class="days">${[[0,"Hoje"],[1,"Ontem"],[2,"Anteontem"]].filter(([d])=>HOJE.getDate()-d>=1).map(([d,n])=>`<button class="chip" aria-pressed="${s.dia===HOJE.getDate()-d}" data-sdia="${HOJE.getDate()-d}">${n}</button>`).join("")}</div>
    ${s.cat!==INVEST?`<div class="days" role="group" aria-label="Forma de pagamento">${[["avista","Pix / débito"],["credito","Crédito à vista"],["parcelado","Parcelado"]].map(([k,n])=>`<button class="chip" aria-pressed="${s.forma===k}" data-sforma="${k}">${n}</button>`).join("")}</div>
    ${s.forma==="parcelado"?`<div class="days" role="group" aria-label="Número de parcelas">${[2,3,4,6,10,12].map(n=>`<button class="chip" aria-pressed="${s.n===n}" data-sn="${n}">${n}×</button>`).join("")}</div>`:""}`:""}
    <div class="keys">${["1","2","3","4","5","6","7","8","9",",","0","⌫"].map(k=>`<button data-key="${k}" aria-label="${k==="⌫"?"Apagar dígito":k}">${k}</button>`).join("")}</div>
    <button class="save" id="salvar" ${v>0?"":"disabled"}>Salvar ${v>0?brl(v):""}</button>`;
}

/* =====================================================
   6. EVENTOS + DESENHO
   ===================================================== */
function render(){
  document.getElementById("hoje").textContent = HOJE.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
  const hr = new Date().getHours();
  document.getElementById("saudacao").textContent = (hr<12?"Bom dia":hr<18?"Boa tarde":"Boa noite") + ", Pablo";
  document.getElementById("demo").style.display = S.exemplo ? "" : "none";
  document.getElementById("view").innerHTML = TELAS[UI.aba]();
  document.querySelectorAll("[data-tab]").forEach(b=>{ if(b.closest(".nav")) b.setAttribute("aria-current", b.dataset.tab===UI.aba||(b.dataset.tab==="dinheiro"&&UI.aba==="regras")?"page":"false"); });
  const corte = document.getElementById("corte");
  if (corte) corte.oninput = e => { // atualiza só os números, sem redesenhar a tela
    UI.corte = +e.target.value;
    document.getElementById("corteVal").textContent = brl(UI.corte);
    document.getElementById("comCorte").textContent = brl(montante(aporteDoMes(rendaMes(0))+UI.corte,10));
  };
  const num = v => { let t = String(v).trim().replace(/[^0-9.,]/g,"");
    if (t.includes(",")) t = t.replace(/\./g,"").replace(",",".");          // 3.700,50
    else if (/\.\d{3}$/.test(t) && !/\.\d{1,2}$/.test(t)) t = t.replace(/\./g,""); // 3.700
    return parseFloat(t); };
  const ff = document.getElementById("formFixo");
  if (ff) ff.onsubmit = e => { e.preventDefault();
    const valor = num(document.getElementById("fxValor").value), nome = document.getElementById("fxNome").value.trim();
    if (!nome || !(valor>0)) { toast("Preencha nome e valor"); return; }
    const rest = parseInt(document.getElementById("fxRest").value);
    const dados = {nome, cat:document.getElementById("fxCat").value, valor, dia:+document.getElementById("fxDia").value||1, fim: rest>0 ? mesKey(rest-1) : undefined};
    const ed = S.fixos.find(x=>x.id===UI.editFixo);
    if (ed) { Object.assign(ed, dados); UI.editFixo = null; render(); toast(`${nome} atualizada`); }
    else { S.fixos.push({id:Date.now(), pagos:[], ...dados}); render(); toast(`${nome} adicionada`); } };
  const fg = document.getElementById("formGuardar");
  if (fg) fg.onsubmit = e => { e.preventDefault(); const v = num(document.getElementById("gValor").value) || Math.max(aporteMeta()-investido(),0);
    if (!(v>0)) { toast("Digite o valor"); return; }
    S.lanc.push({id:Date.now(), mes:mesKey(0), dia:HOJE.getDate(), cat:INVEST, sub:document.getElementById("gSub").value, valor:v});
    UI.formInv = null; render(); toast(`Guardou ${brl(v)} ✓`); };
  const fres = document.getElementById("formResgatar");
  if (fres) fres.onsubmit = e => { e.preventDefault(); const v = num(document.getElementById("rValor").value);
    if (!(v>0)) { toast("Digite o valor"); return; }
    const off = +document.getElementById("rMes").value;
    (S.resgates ??= []).push({id:Date.now(), mes:mesKey(off), dia: off===0?HOJE.getDate():1, valor:v, motivo:document.getElementById("rMotivo").value.trim()});
    UI.formInv = null; render(); toast(`Resgate de ${brl(v)} em ${nomeMes(off)} registrado`); };
  const fs = document.getElementById("formSaldo");
  if (fs) fs.onsubmit = e => { e.preventDefault(); const v = num(document.getElementById("sValor").value);
    if (!(v>=0) || document.getElementById("sValor").value.trim()==="") { toast("Digite o saldo"); return; }
    S.guardadoInicial = v - aportesAte(0) + resgatesAte(0);
    UI.formInv = null; render(); toast("Saldo atualizado ✓"); };
  document.querySelectorAll("[data-orc]").forEach(inp => inp.onchange = () => {
    const v = num(inp.value); if (!(v>=0)) return;
    S.orcamento = {...ORC(), [inp.dataset.orc]: v}; render(); toast(`Orçamento de ${inp.dataset.orc}: ${brl(v)}`); });
  document.querySelectorAll("[data-rvform]").forEach(fr => fr.onsubmit = e => { e.preventDefault();
    const v = num(fr.querySelector("input").value); if (!(v>0)) { toast("Digite o valor que caiu"); return; }
    S.rv.find(x=>x.mes===fr.dataset.rvform).real = v; UI.dia2 = false; render(); toast("Renda confirmada ✓"); });
  const frm = document.getElementById("formRendaMes");
  if (frm) frm.onsubmit = e => { e.preventDefault(); const v = num(document.getElementById("rendaMes").value);
    if (!(v>0)) { toast("Digite a renda do mês"); return; }
    let r = S.rv.find(x=>x.mes===mesKey(0)); if (!r) { r = {mes:mesKey(0), prev:v, real:v}; S.rv.push(r); } else { r.prev = r.prev||v; r.real = v; }
    render(); toast("Renda salva ✓"); };
  setTimeout(salvar, 0);
  const imp = document.getElementById("importar");
  if (imp) imp.onchange = async () => { try {
      const d = JSON.parse(await imp.files[0].text());
      if (!d.S) throw 0; S = d.S; TAR = d.TAR||[]; TRE = d.TRE||TRE; CART = d.CART||CART; S.resgates ??= [];
      render(); toast("Backup restaurado ✓");
    } catch(e) { toast("Esse arquivo não é um backup do app"); } };
  const q = document.getElementById("quickTask");
  if (q) q.onsubmit = e => { e.preventDefault(); const v = document.getElementById("novaTarefa").value.trim(); if(!v) return;
    TAR.push({id:Date.now(), t:v, area:UI.filtro==="Todas"?"Pessoal":UI.filtro, data:dataKey(0), feita:false}); render(); toast("Tarefa adicionada"); document.getElementById("novaTarefa").focus(); };
}
/* salvar no próprio celular (localStorage) */
const CHAVE = "assistente-pablo-v1";
function salvar(){ try { localStorage.setItem(CHAVE, JSON.stringify({S, TAR, TRE, CART})); } catch(e) {} }
function carregar(){
  try { const d = JSON.parse(localStorage.getItem(CHAVE)); if (d && d.S) { S = d.S; if (S.guardadoInicial==null) S.guardadoInicial = S.reservaAnterior||0; S.resgates ??= []; TAR = d.TAR || []; TRE = d.TRE || TRE; CART = d.CART || CART; } } catch(e) {}
}
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function irPara(aba){
  if (SUBS[aba]) { UI.aba = "dinheiro"; UI.sub = aba; } else UI.aba = aba;
  render(); window.scrollTo({top:0});
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if (d.tab) irPara(d.tab);
  else if (d.tabGo) irPara(d.tabGo);
  else if (d.sub) { UI.sub = d.sub; render(); }
  else if (d.ver) { UI.catAberta = d.ver; irPara("gastos"); document.getElementById("cat-"+d.ver)?.scrollIntoView({block:"center"}); }
  else if (d.cat) { UI.catAberta = UI.catAberta===d.cat?null:d.cat; render(); }
  else if (d.apagar) { S.lanc = S.lanc.filter(l=>l.id!==+d.apagar); render(); toast("Lançamento apagado"); }
  else if (d.pagar) { const f = S.fixos.find(f=>f.id===+d.pagar); f.pagos = f.pagos||[];
    if (pagoNoMes(f)) f.pagos = f.pagos.filter(m=>m!==mesKey(0)); else f.pagos.push(mesKey(0));
    render(); if(pagoNoMes(f)) toast(`${f.nome} paga ✓`); }
  else if (d.edfixo) { UI.editFixo = +d.edfixo; render(); document.getElementById("cardFormFixo")?.scrollIntoView({block:"start"}); }
  else if (b.id==="cancelarEdicao") { UI.editFixo = null; render(); }
  else if (d.rmparc) { S.parcelados = S.parcelados.filter(p=>p.id!==+d.rmparc); render(); toast("Parcela removida"); }
  else if (d.forminv) { UI.formInv = UI.formInv===d.forminv ? null : d.forminv; render(); }
  else if (d.rmresgate) { S.resgates = S.resgates.filter(r=>r.id!==+d.rmresgate); render(); toast("Resgate removido"); }
  else if (d.rmfixo) { S.fixos = S.fixos.filter(f=>f.id!==+d.rmfixo); render(); toast("Conta removida"); }
  else if (d.rvdelta) { const r = rvProximo(); r.prev = Math.max(0, r.prev + +d.rvdelta); render(); }
  else if (b.id==="simDia2") { UI.dia2 = true; render(); }
  else if (d.confirmar) { const r = S.rv.find(x=>x.mes===d.confirmar); r.real = r.prev; UI.dia2 = false; render(); toast("Renda confirmada ✓"); }
  else if (d.feita) { const x = TAR.find(x=>x.id===+d.feita);
    if (x.rotina) x.feitaEm = feita(x) ? null : dataKey(0); else x.feita = !x.feita;
    render(); if(feita(x)) toast("Feito ✓"); }
  else if (d.adiar) { const x = TAR.find(x=>x.id===+d.adiar); x.data = dataKey(1); render(); toast("Adiada para amanhã"); }
  else if (d.rmtarefa) { TAR = TAR.filter(x=>x.id!==+d.rmtarefa); render(); toast("Tarefa apagada"); }
  else if (d.filtro) { UI.filtro = d.filtro; render(); }
  else if (d.serie) { const f = feitosHoje(); f[d.serie] ? delete f[d.serie] : f[d.serie] = true; render(); }
  else if (d.carga) { const ex = treinoDeHoje().ex[+d.carga]; TRE.cargas[ex[0]] = Math.max(0, carga(ex) + +d.delta); render(); }
  else if (b.id==="concluirTreino") { TRE.log[dataKey(0)] = "ok";
    treinoDeHoje().ex.forEach(e=>{ if(e[3]) { (TRE.hist[e[0]] ??= []).push(carga(e)); TRE.hist[e[0]] = TRE.hist[e[0]].slice(-12); } });
    render(); toast("Treino concluído 💪"); }
  else if (b.id==="abrirLancar") abrirSheet();
  else if (b.id==="abrirGasto") abrirSheet("gasto");
  else if (b.id==="reset") { S = exemplo(); EMP = empresasExemplo(); CART = {caixa:10000,pos:[],mes:0,licao:""}; TAR = tarefasExemplo(); TRE = treinoExemplo(); UI.catAberta=null; UI.dia2=false; render(); toast("Exemplo restaurado"); }
  else if (b.id==="abrirRegras") irPara("regras");
  else if (b.id==="exportar") {
    const blob = new Blob([JSON.stringify({versao:1, data:dataKey(0), S, TAR, TRE, CART}, null, 1)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `assistente-backup-${dataKey(0)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); toast("Backup baixado ✓"); }
  else if (b.id==="zerar") {
    if (!UI.confirmaZerar) { UI.confirmaZerar = true; b.textContent = "Toque de novo para confirmar"; return; }
    S = vazio(); TAR = []; const t = treinoExemplo(); TRE = {...t, log:{}, hist:{}}; CART = {caixa:10000,pos:[],mes:0,licao:""};
    UI.confirmaZerar = false; irPara("hoje"); toast("Pronto! Tudo zerado."); }
  else if (d.janela) { UI.janela = d.janela; render(); }
  else if (d.acao) { UI.acao = UI.acao===d.acao?null:d.acao; UI.compra = {motivo:null, valor:null}; render(); }
  else if (d.motivo) { UI.compra.motivo = d.motivo; render(); }
  else if (d.valor) { UI.compra.valor = +d.valor; render(); }
  else if (d.comprar) {
    const e = EMP.find(x=>x.tk===d.comprar), v = UI.compra.valor;
    CART.caixa -= v; CART.pos.push({tk:e.tk, qtd:v/ultimo(e), custo:v, motivo:UI.compra.motivo, mes:CART.mes});
    UI.compra = {motivo:null, valor:null}; render(); toast(`Treino: comprou ${brl(v)} de ${e.tk}`);
  }
  else if (b.id==="avancar") { avancarMes(); render(); }
  else if (UI.sheet) {
    const s = UI.sheet;
    if (d.modo) s.modo = d.modo;
    else if (d.sarea) s.area = d.sarea;
    else if (d.sq) s.q = +d.sq;
    else if (d.srotina) s.rotina = !s.rotina;
    else if (b.id==="salvarTarefa") {
      if (!s.titulo.trim()) { document.getElementById("sheetTitulo").focus(); return; }
      TAR.push(s.rotina ? {id:Date.now(), t:s.titulo.trim(), area:s.area, rotina:"diária"} : {id:Date.now(), t:s.titulo.trim(), area:s.area, data:dataKey(s.q), feita:false});
      fecharSheet(); render(); toast("Tarefa salva"); return;
    }
    else if (d.scat) { s.cat = d.scat; s.sub = CONFIG.categorias[d.scat][0]; }
    else if (d.ssub) s.sub = d.ssub;
    else if (d.sdia) s.dia = +d.sdia;
    else if (d.key) {
      if (d.key==="⌫") s.valor = s.valor.slice(0,-1);
      else if (d.key===",") { if(!s.valor.includes(",")) s.valor = (s.valor||"0")+","; }
      else if (!(s.valor.includes(",") && s.valor.split(",")[1].length>=2) && s.valor.length<8) s.valor = (s.valor==="0"?"":s.valor)+d.key;
    }
    else if (d.sforma) s.forma = d.sforma;
    else if (d.sn) s.n = +d.sn;
    else if (b.id==="salvar") {
      const valor = parseFloat(s.valor.replace(",","."));
      if (s.forma==="parcelado" && s.cat!==INVEST) {
        S.parcelados.push({id:Date.now(), cat:s.cat, sub:s.sub, total:valor, n:s.n, inicio:mesKey(0), dia:s.dia});
        fecharSheet(); render(); toast(`Salvo: ${s.n}× de ${brl(valor/s.n)} em ${s.sub}`); return;
      }
      S.lanc.push({id:Date.now(), mes:mesKey(0), dia:s.dia, cat:s.cat, sub:s.sub, valor});
      fecharSheet(); render(); toast(`Salvo: ${brl(valor)} em ${s.sub}`); return;
    }
    renderSheet();
  }
});
document.addEventListener("click", () => setTimeout(salvar, 0));
document.addEventListener("submit", () => setTimeout(salvar, 0));
document.getElementById("scrim").onclick = fecharSheet;
document.addEventListener("keydown", e => { if(e.key==="Escape") fecharSheet(); });

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState==="visible") { const d = new Date(); d.setHours(0,0,0,0); if (d.getTime()!==HOJE.getTime()) location.reload(); }
});
carregar();
render();
</script>
